server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # connect-src/style-src/font-src apuntan a los dominios reales de config/config.prod.js
    # (auth.eva-core.com para Keycloak, movement.eva-core.com para API+WebSocket) y a Google
    # Fonts, que es lo único cargado desde index.html fuera de este origen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://movement.eva-core.com wss://movement.eva-core.com https://auth.eva-core.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # config.js se inyecta en runtime (mismo dist/ sirve a varios entornos) e index.html
    # referencia los hashes del build actual — ninguno de los dos puede cachearse, o un deploy
    # nuevo no se vería hasta que expire el cache viejo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash de contenido en el nombre (Vite): un deploy nuevo nunca reutiliza el mismo
    # nombre de archivo con contenido distinto, así que se puede cachear "para siempre" sin
    # riesgo de servir una versión vieja.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Resto de estáticos servidos tal cual desde public/ (favicon, etc.) — sin hash en el
    # nombre, así que un cache más corto para que un cambio se refleje en tiempo razonable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA fallback - todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (opcional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}